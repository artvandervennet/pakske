# Pakske on a Raspberry Pi (or any Docker host).
#
#   cp .env.example .env      # then fill in NUXT_APP_SECRET
#   docker compose up -d --build
#
# The database and the uploaded images live in the `pakske-data` volume.
name: pakske
services:
  pakske:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NUXT_APP_SECRET: ${NUXT_APP_SECRET:?Set NUXT_APP_SECRET in .env (see .env.example)}
      NUXT_SESSION_COOKIE_SECURE: ${NUXT_SESSION_COOKIE_SECURE:-true}
      NUXT_TRUST_PROXY: ${NUXT_TRUST_PROXY:-false}
      NUXT_MAX_USERS: ${NUXT_MAX_USERS:-200}
      NUXT_FIREBASE_API_KEY: ${NUXT_FIREBASE_API_KEY:?Set NUXT_FIREBASE_API_KEY in .env (see .env.example)}
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ${NUXT_OAUTH_GOOGLE_CLIENT_ID:-}
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${NUXT_OAUTH_GOOGLE_CLIENT_SECRET:-}
      NUXT_OAUTH_GOOGLE_REDIRECT_URL: ${NUXT_OAUTH_GOOGLE_REDIRECT_URL:-}
      NUXT_PUBLIC_OPERATOR_NAME: ${NUXT_PUBLIC_OPERATOR_NAME:-}
      NUXT_PUBLIC_OPERATOR_EMAIL: ${NUXT_PUBLIC_OPERATOR_EMAIL:-}
      NUXT_PUBLIC_OPERATOR_NETWORK: ${NUXT_PUBLIC_OPERATOR_NETWORK:-}
      NUXT_PUBLIC_OPERATOR_BACKUPS: ${NUXT_PUBLIC_OPERATOR_BACKUPS:-}
    volumes:
      - pakske-data:/data

volumes:
  pakske-data:
